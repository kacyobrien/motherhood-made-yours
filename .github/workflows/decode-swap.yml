name: Decode Kailee swap files
on:
  push:
    paths:
      - 'staging-b64/**'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode files
        run: |
          base64 -d staging-b64/coaching.html.b64 > coaching.html
          base64 -d staging-b64/kailee.webp.b64 > assets/testimonials/kailee.webp
      - name: Commit files
        run: |
          git config user.name "kacyobrien"
          git config user.email "kacyobrien@users.noreply.github.com"
          git add coaching.html assets/testimonials/kailee.webp
          git commit -m "Kailee takes the third story card; Jennifer M card out" || exit 0
          git push
