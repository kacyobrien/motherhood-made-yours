name: Decode coaching page
on:
  push:
    paths:
      - 'staging-b64/**'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode file
        run: |
          base64 -d staging-b64/coaching.html.b64 > coaching.html
      - name: Commit file
        run: |
          git config user.name "kacyobrien"
          git config user.email "kacyobrien@users.noreply.github.com"
          git add coaching.html
          git commit -m "Coaching page: second How I work paragraph" || exit 0
          git push
